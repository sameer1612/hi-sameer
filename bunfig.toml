[install]
# Pin exact versions when adding packages, so nothing updates on its own.
exact = true

[fmt]
printWidth = 120
singleQuote = true
arrowParens = "avoid"
ignorePatterns = [
  "bun.lock",
  # Blog posts are written by hand, not reformatted
  "src/content",
  # Search console verification file, must stay byte-for-byte
  "public/google*.html",
]
