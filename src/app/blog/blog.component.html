<section id="blog" class="blog section-bg">
  <div class="container">
    <div class="section-title">
      <h2>Articles</h2>
      <p>
        If you know something but can't explain to someone else, its
        doesn't count. Whenever I write something, its not for someone
        else but for my one month earlier version completely unaware of
        how cool that tech is.
      </p>
    </div>

    <div class="row" data-aos="fade-up">
      <div class="col-lg-12 d-flex justify-content-center">
        <ul id="blog-flters">
          <li data-filter="*" class="filter-active">All</li>
          <li data-filter=".filter-web">Tech</li>
        </ul>
      </div>
    </div>
  </div>
  <div id="articles-container" class="row articles-container">
    <div class="col-lg-4 col-md-6 article filter-web" *ngFor="let article of articles">
      <div class="text-center">
        <a target="_blank" href="{{article.canonical_url}}">
          <img src="{{article.cover_image}}" class="img-fluid rounded" style="object-fit: contain;"
            alt="{{article.title}}" />
          <p class="text-secondary mt-2">{{article.title}}</p>
        </a>
      </div>
    </div>
  </div>
</section>
